<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeridiMeet has moved / 移転しました</title>
<link rel="canonical" href="https://meridibrand.com/meet">
<meta name="robots" content="noindex">
<script>
  // Move immediately, keeping ?query and #hash (event links stay working)
  location.replace('https://meridibrand.com/meet' + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://meridibrand.com/meet"></noscript>
<style>
body{background:#000;color:#a3e635;font-family:'Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
.box{border:1px solid #00ff00;border-radius:8px;padding:30px 36px;max-width:440px}
h1{color:#00ff00;font-size:1.4rem;margin:0 0 12px}
a{color:#00ff00;font-weight:bold}
p{color:#ccc;line-height:1.7;font-size:.95rem}
</style>
</head>
<body>
<div class="box">
  <h1>📅 MeridiMeet has moved</h1>
  <p>MeridiMeet は新しい URL に移転しました。<br>自動で移動しない場合は、下のリンクを押してください。</p>
  <p><a id="go" href="https://meridibrand.com/meet">https://meridibrand.com/meet</a></p>
</div>
<script>
  document.getElementById('go').href = 'https://meridibrand.com/meet' + location.search + location.hash;
</script>

</html>
