<body>

    <h1>MeridiMeet</h1>
    <div class="subtitle" id="subtitleText">海外との会議・ゲーム・イベントの時差をゼロにするスケジュール調整ツール</div>

    <!-- 主催者作成画面 -->
    <div id="creatorView">
        <div class="section">
            <label>📝 Event Name / イベント名:</label>
            <input type="text" id="eventName" placeholder="e.g. Team Sync / チーム定例">
        </div>
        <div class="section">
            <label>📝 Description / 説明:</label>
            <textarea id="eventDescription" placeholder="e.g. Weekly standup / 週次ミーティング"></textarea>
        </div>
        <div class="section">
            <label>📅 Select Dates / 日付を選択:</label>
            <div class="calendar-nav">
                <button onclick="changeMonth(-1)">&lt;</button>
                <span class="month-title" id="monthTitle"></span>
                <button onclick="changeMonth(1)">&gt;</button>
            </div>
            <div class="calendar-header" id="calendarHeader"></div>
            <div class="days-grid" id="calendarGrid"></div>
        </div>
        <div class="section" id="timeSlotsSection" style="display:none;">
            <label>⏰ Time Slots / 時間帯:</label>
            <div id="timeSlotList"></div>
            <button class="add-btn" onclick="addTimeSlot()">+ Add Time Slot / 時間帯を追加</button>
        </div>
        <div class="section">
            <label>🌐 Category / カテゴリ:</label>
            <select id="eventCategory" onchange="toggleCustomCategory()">
                <optgroup label="Business / ビジネス">
                    <option value="Team Meeting">Team Meeting / チーム会議</option>
                    <option value="Client Call">Client Call / クライアント通話</option>
                    <option value="Workshop">Workshop / ワークショップ</option>
                    <option value="1-on-1">1-on-1 / 個別面談</option>
                </optgroup>
                <optgroup label="Social / ソーシャル">
                    <option value="Party">Party / パーティー</option>
                    <option value="Reunion">Reunion / 同窓会</option>
                    <option value="Hangout">Hangout / 集まり</option>
                </optgroup>
                <optgroup label="Gaming / ゲーム">
                    <option value="Raid">Raid / レイド</option>
                    <option value="Tournament">Tournament / トーナメント</option>
                    <option value="Casual Play">Casual Play / カジュアルプレイ</option>
                </optgroup>
                <optgroup label="Sports / スポーツ">
                    <option value="Futsal">Futsal / フットサル</option>
                    <option value="Running">Running / ランニング</option>
                    <option value="Gym">Gym / ジム</option>
                </optgroup>
                <optgroup label="Other / その他">
                    <option value="Study Groups">Study Groups / 勉強会</option>
                    <option value="Gaming & Teams">Gaming & Teams / ゲーム＆チーム</option>
                    <option value="__custom__">✏️ Other (Free Input) / その他（自由入力）</option>
                </optgroup>
            </select>
            <input type="text" id="customCategoryInput" placeholder="e.g. BBQ / バーベキュー" style="display:none;margin-top:5px;">
        </div>
        <button class="action-btn" onclick="generateLink()">時差換算URLを発行する (クリップボードにコピー)</button>
    </div>

    <!-- 回答者画面 -->
    <div id="attendeeView" style="display:none;">
        <div class="section">
            <div class="timezone-notice" id="timezoneNotice"></div>
            <label>👤 Your Name / あなたの名前:</label>
            <input type="text" id="attendeeName" placeholder="e.g. Taro / 太郎">
            <label style="margin-top:8px;display:block;">💬 Comment / コメント (optional):</label>
            <textarea id="attendeeComment" placeholder="e.g. I might be 5 min late / 5分遅れるかも"></textarea>
            <div id="attendeeSlots"></div>
            <button class="action-btn" onclick="submitAttendance()">回答を送信する</button>
        </div>
        <div class="section">
            <h3 style="color:#00ff00;">📊 出欠集計ボード (<span id="boardTimezoneLabel"></span>)</h3>
            <div id="respondentCount" style="font-size:0.85rem;color:#888;margin-bottom:10px;"></div>
            <div style="overflow-x:auto;">
                <table class="summary-table" id="summaryTable"></table>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal -->
    <div class="modal-overlay" id="customModal">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">Notice</div>
            <div class="modal-body" id="modalBody"></div>
            <button class="modal-close-btn" onclick="closeCustomAlert()">OK</button>
        </div>
    </div>

    <!-- Footer -->
    <div class="premium-ad-bar">

    <script>
        var isJapanese = (navigator.language || navigator.userLanguage || '').startsWith('ja');
        var selectedDates = [];
        var currentMonth = new Date().getMonth();
        var currentYear = new Date().getFullYear();
        var decodedEventData = null;
        var respondents = {};
        var editingRespondentId = null;
        var currentEventId = null;

        function showCustomAlert(title, message, isSuccess) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalTitle').className = isSuccess ? 'modal-title success' : 'modal-title';
            document.getElementById('modalBody').innerHTML = message;
            document.getElementById('customModal').classList.add('active');
        }
        function closeCustomAlert() {
            document.getElementById('customModal').classList.remove('active');
        }

        function toggleCustomCategory() {
            var sel = document.getElementById('eventCategory');
            var input = document.getElementById('customCategoryInput');
            if (sel.value === '__custom__') {
                input.style.display = 'block';
                input.focus();
            } else {
                input.style.display = 'none';
                input.value = '';
            }
        }

        function renderCalendar() {
            var months = isJapanese
                ? ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月']
                : ['January','February','March','April','May','June','July','August','September','October','November','December'];
            var days = isJapanese ? ['月','火','水','木','金','土','日'] : ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
            document.getElementById('monthTitle').textContent = months[currentMonth] + ' ' + currentYear;
            var headerEl = document.getElementById('calendarHeader');
            headerEl.innerHTML = '';
            days.forEach(function(d) {
                var span = document.createElement('span');
                span.textContent = d;
                headerEl.appendChild(span);
            });
            var grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            var firstDay = new Date(currentYear, currentMonth, 1).getDay();
            var adjusted = (firstDay === 0) ? 6 : firstDay - 1;
            var daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            for (var i = 0; i < adjusted; i++) {
                var emptyBtn = document.createElement('button');
                emptyBtn.className = 'day-btn empty';
                emptyBtn.disabled = true;
                grid.appendChild(emptyBtn);
            }
            for (var d = 1; d <= daysInMonth; d++) {
                var btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.textContent = d;
                var dateObj = new Date(currentYear, currentMonth, d);
                var dateStr = currentYear + '-' + String(currentMonth + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
                if (dateObj < today) {
                    btn.disabled = true;
                } else {
                    btn.setAttribute('data-date', dateStr);
                    if (selectedDates.indexOf(dateStr) !== -1) btn.classList.add('selected');
                    btn.onclick = function () {
                        var ds = this.getAttribute('data-date');
                        var idx = selectedDates.indexOf(ds);
                        if (idx === -1) { selectedDates.push(ds); this.classList.add('selected'); }
                        else { selectedDates.splice(idx, 1); this.classList.remove('selected'); }
                        selectedDates.sort();
                        renderTimeSlots();
                    };
                }
                grid.appendChild(btn);
            }
        }
        function changeMonth(dir) { currentMonth += dir; if (currentMonth > 11) { currentMonth = 0; currentYear++; } if (currentMonth < 0) { currentMonth = 11; currentYear--; } renderCalendar(); }

        function renderTimeSlots() {
            var section = document.getElementById('timeSlotsSection');
            var list = document.getElementById('timeSlotList');
            if (selectedDates.length === 0) { section.style.display = 'none'; return; }
            section.style.display = 'block';
            if (list.children.length === 0) {
                addTimeSlot();
                addTimeSlot();
                addTimeSlot();
            }
        }
        function addTimeSlot() {
            var list = document.getElementById('timeSlotList');
            var row = document.createElement('div');
            row.style.cssText = 'display:flex;gap:8px;align-items:center;margin:5px 0;';
            var sel = document.createElement('select');
            sel.style.cssText = 'flex:1;background:#000;border:1px solid #00ff00;color:#fff;padding:6px;border-radius:4px;';
            for (var h = 0; h < 24; h++) {
                for (var m = 0; m < 60; m += 30) {
                    var opt = document.createElement('option');
                    opt.value = String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0');
                    opt.textContent = opt.value;
                    sel.appendChild(opt);
                }
            }
            var removeBtn = document.createElement('button');
            removeBtn.textContent = '✕';
            removeBtn.className = 'add-btn';
            removeBtn.onclick = function () { row.remove(); };
            row.appendChild(sel);
            row.appendChild(removeBtn);
            list.appendChild(row);
        }

        function getLocalTimezone() {
            try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return 'UTC'; }
        }

        function generateLink() {
            var name = document.getElementById('eventName').value.trim();
            var description = document.getElementById('eventDescription').value.trim();
            var localZone = getLocalTimezone();
            var categorySel = document.getElementById('eventCategory');
            var category = categorySel.value;
            if (category === '__custom__') {
                category = document.getElementById('customCategoryInput').value.trim();
                if (!category) {
                    showCustomAlert(
                        isJapanese ? "入力エラー" : "Input Error",
                        isJapanese ? "カテゴリを入力してください。" : "Please enter a category.",
                        false
                    );
                    return;
                }
            }
            if (!name) {
                showCustomAlert(
                    isJapanese ? "入力エラー" : "Input Error",
                    isJapanese ? "イベント名を入力してください。" : "Please enter an event name.",
                    false
                );
                return;
            }
            if (selectedDates.length === 0) {
                showCustomAlert(
                    isJapanese ? "入力エラー" : "Input Error",
                    isJapanese ? "少なくとも1つの日付を選択してください。" : "Please select at least one date.",
                    false
                );
                return;
            }
            var timeSlotSelects = document.querySelectorAll('#timeSlotList select');
            var times = [];
            timeSlotSelects.forEach(function(s) { times.push(s.value); });
            if (times.length === 0) times.push('20:00');
            var timestamps = [];
            selectedDates.forEach(function(date) {
                times.forEach(function(time) {
                    var localStr = date + ' ' + time;
                    var parts = localStr.split(/[- :]/);
                    var localDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), parseInt(parts[3]), parseInt(parts[4]));
                    timestamps.push({ original: localStr, utc: localDate.toISOString() });
                });
            });
            var data = { name: name, description: description, category: category, creatorZone: localZone, timestamps: timestamps };
            var newEventRef = db.ref('events').push();
            var eventId = newEventRef.key;
            newEventRef.set(data).then(function() {
                var baseURL = window.location.href.split('?')[0];
                var finalURL = baseURL + '?id=' + eventId;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(finalURL).then(function() {
                        showCustomAlert(
                            isJapanese ? "成功" : "SUCCESS",
                            isJapanese ? "URLをコピーしました！調整相手に送ってください。" : "URL copied! Share it with your group.",
                            true
                        );
                    });
                } else {
                    showCustomAlert(
                        isJapanese ? "成功" : "SUCCESS",
                        (isJapanese ? "以下のURLを共有してください:\n" : "Share this URL:\n") + finalURL,
                        true
                    );
                }
                setTimeout(function() {
                    window.location.href = finalURL;
                }, 1500);
            }).catch(function(err) {
                showCustomAlert("Error", "Firebase save failed: " + err.message, false);
            });
        }

        // Firebase 版: URL パラメータ処理
        var urlParams = new URLSearchParams(window.location.search);
        var eventIdParam = urlParams.get('id');
        var eventDataParam = urlParams.get('event');

        if (eventIdParam) {
            currentEventId = eventIdParam;
            db.ref('events/' + eventIdParam).once('value').then(function(snapshot) {
                var data = snapshot.val();
                if (data) {
                    decodedEventData = data;
                    document.getElementById('creatorView').style.display = 'none';
                    document.getElementById('attendeeView').style.display = 'block';
                    document.getElementById('subtitleText').textContent = data.name;
                    document.getElementById('timezoneNotice').innerHTML = '🌎 ' +
                        (isJapanese ? '主催者のタイムゾーン: ' : "Organizer's timezone: ") +
                        data.creatorZone +
                        '<br>' +
                        (isJapanese ? '名前を入力し、あなたの現地時間で空いている日時に回答してください。' : 'Enter your name and respond based on your local time.');
                    document.getElementById('boardTimezoneLabel').textContent =
                        (isJapanese ? '主催者時間: ' : 'Organizer time: ') + data.creatorZone;
                    refreshAttendeeSlots();
                    db.ref('responses/' + eventIdParam).on('value', function(respSnapshot) {
                        respondents = {};
                        var respData = respSnapshot.val();
                        if (respData) {
                            var keys = Object.keys(respData);
                            for (var i = 0; i < keys.length; i++) {
                                respondents[keys[i]] = respData[keys[i]];
                            }
                        }
                        updateBoard();
                    });
                } else {
                    showCustomAlert("Error", "Event not found.", false);
                }
            });
        } else if (eventDataParam) {
            try {
                decodedEventData = JSON.parse(decodeURIComponent(eventDataParam));
                document.getElementById('creatorView').style.display = 'none';
                document.getElementById('attendeeView').style.display = 'block';
                document.getElementById('subtitleText').textContent = decodedEventData.name;
                var zone = decodedEventData.creatorZone || 'UTC';
                document.getElementById('timezoneNotice').innerHTML = '🌎 ' +
                    (isJapanese ? '主催者のタイムゾーン: ' : "Organizer's timezone: ") + zone +
                    '<br>' +
                    (isJapanese ? '名前を入力し、あなたの現地時間で空いている日時に回答してください。' : 'Enter your name and respond based on your local time.');
                document.getElementById('boardTimezoneLabel').textContent =
                    (isJapanese ? '主催者時間: ' : 'Organizer time: ') + zone;
                refreshAttendeeSlots();
            } catch (e) {
                showCustomAlert("Error", "Invalid Event URL.", false);
            }
        }

        function refreshAttendeeSlots() {
            if (!decodedEventData) return;
            var container = document.getElementById('attendeeSlots');
            container.innerHTML = '';
            var localZone = getLocalTimezone();
            decodedEventData.timestamps.forEach(function(ts, idx) {
                var utcDate = new Date(ts.utc);
                var localStr = utcDate.toLocaleString('en-US', {
                    timeZone: localZone,
                    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit', hour12: false
                });
                var row = document.createElement('div');
                row.className = 'slot-row';
                row.innerHTML = '<span style="flex:1;font-size:0.85rem;">' + localStr + '</span>' +
                    '<div class="radio-group">' +
                    '<button onclick="selectStatus(this,\'ok\')" data-slot="' + idx + '">⭕</button>' +
                    '<button onclick="selectStatus(this,\'maybe\')" data-slot="' + idx + '">🔺</button>' +
                    '<button onclick="selectStatus(this,\'no\')" data-slot="' + idx + '">✖️</button>' +
                    '</div>';
                container.appendChild(row);
            });
        }

        function selectStatus(btn, status) {
            var group = btn.parentElement;
            var buttons = group.children;
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].className = '';
            }
            if (status === 'ok') btn.className = 'active-ok';
            else if (status === 'maybe') btn.className = 'active-maybe';
            else if (status === 'no') btn.className = 'active-no';
        }

        function submitAttendance() {
            var name = document.getElementById('attendeeName').value.trim();
            var comment = document.getElementById('attendeeComment').value.trim();
            if (!name) {
                showCustomAlert(
                    isJapanese ? "入力エラー" : "Input Error",
                    isJapanese ? "名前を入力してください。" : "Please enter your name.",
                    false
                );
                return;
            }
            var answers = {};
            var slots = document.querySelectorAll('#attendeeSlots .slot-row');
            slots.forEach(function(row, idx) {
                var active = row.querySelector('.radio-group button[class*="active"]');
                if (active) {
                    var safeKey = decodedEventData.timestamps[idx].utc.replace(/\./g, '-');
                    var btnClass = active.className;
                    if (btnClass.indexOf('active-ok') !== -1) answers[safeKey] = 'ok';
                    else if (btnClass.indexOf('active-maybe') !== -1) answers[safeKey] = 'maybe';
                    else if (btnClass.indexOf('active-no') !== -1) answers[safeKey] = 'no';
                }
            });

            var localZone = getLocalTimezone();
            var respondentData = { name: name, comment: comment, timezone: localZone, answers: answers };

            if (currentEventId) {
                if (editingRespondentId) {
                    db.ref('responses/' + currentEventId + '/' + editingRespondentId).set(respondentData);
                    editingRespondentId = null;
                } else {
                    db.ref('responses/' + currentEventId).push(respondentData);
                }
            } else {
                var id = editingRespondentId || ('local_' + Date.now());
                respondents[id] = respondentData;
                editingRespondentId = null;
                updateBoard();
            }

            showCustomAlert(
                isJapanese ? "成功" : "SUCCESS",
                isJapanese ? "回答ありがとうございます、" + name + "さん！" : "Thank you, " + name + "!",
                true
            );
            document.getElementById('attendeeName').value = '';
            document.getElementById('attendeeComment').value = '';
            var allBtns = document.querySelectorAll('#attendeeSlots .radio-group button');
            for (var i = 0; i < allBtns.length; i++) {
                allBtns[i].className = '';
            }
        }

        function startEdit(id) {
            var r = respondents[id];
            if (!r) return;
            editingRespondentId = id;
            document.getElementById('attendeeName').value = r.name;
            document.getElementById('attendeeComment').value = r.comment || '';
            var slots = document.querySelectorAll('#attendeeSlots .slot-row');
            slots.forEach(function(row, idx) {
                var safeKey = decodedEventData.timestamps[idx].utc.replace(/\./g, '-');
                var val = r.answers[safeKey];
                var buttons = row.querySelectorAll('.radio-group button');
                for (var i = 0; i < buttons.length; i++) {
                    buttons[i].className = '';
                }
                if (val === 'ok') buttons[0].className = 'active-ok';
                else if (val === 'maybe') buttons[1].className = 'active-maybe';
                else if (val === 'no') buttons[2].className = 'active-no';
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function updateBoard() {
            if (!decodedEventData) return;
            var table = document.getElementById('summaryTable');
            var keys = Object.keys(respondents);
            document.getElementById('respondentCount').textContent = keys.length + (isJapanese ? ' 人が回答中' : ' respondent(s)');
            var creatorZone = decodedEventData.creatorZone || 'UTC';
            var headerRow = '<tr><th style="text-align:left;">時間枠</th>';
            keys.forEach(function(k) {
                var r = respondents[k];
                headerRow += '<th>' + r.name + '<br><span style="font-size:0.65rem;color:#888;">(' + (r.timezone || '').replace(/.*\//, '') + ')</span>';
                if (r.comment) headerRow += '<br><span class="comment-text">💬 ' + r.comment + '</span>';
                headerRow += '<br><span class="edit-link" onclick="startEdit(\'' + k + '\')">⚙️ ' + (isJapanese ? '編集' : 'Edit') + '</span>';
                headerRow += '</th>';
            });
            headerRow += '</tr>';

            var bestScore = -1;
            var bestIdx = -1;
            var rows = '';
            decodedEventData.timestamps.forEach(function(ts, idx) {
                var utcDate = new Date(ts.utc);
                var label = utcDate.toLocaleString('en-US', {
                    timeZone: creatorZone,
                    weekday: 'short', month: 'short', day: 'numeric',
                    hour: '2-digit', minute: '2-digit', hour12: false
                });
                var score = 0;
                var cells = '';
                keys.forEach(function(k) {
                    var safeKey = ts.utc.replace(/\./g, '-');
                    var val = respondents[k].answers[safeKey] || '-';
                    var cellClass = '';
                    var display = val;
                    if (val === 'ok') { cellClass = 'cell-ok'; display = '⭕'; score += 2; }
                    else if (val === 'maybe') { cellClass = 'cell-maybe'; display = '🔺'; score += 1; }
                    else if (val === 'no') { cellClass = 'cell-no'; display = '✖️'; }
                    cells += '<td class="' + cellClass + '">' + display + '</td>';
                });
                if (score > bestScore) { bestScore = score; bestIdx = idx; }
                rows += '<tr data-idx="' + idx + '" data-score="' + score + '"><td class="slot-axis">' + label + '</td>' + cells + '</tr>';
            });

            table.innerHTML = headerRow + rows;
            if (bestScore > 0 && keys.length > 0) {
    var allRows = table.querySelectorAll('tr[data-idx]');
    for (var r = 0; r < allRows.length; r++) {
        if (parseInt(allRows[r].getAttribute('data-score')) === bestScore) {
            allRows[r].classList.add('row-best');
        }
    }
}
        }

        renderCalendar();
    </script>

    <script data-goatcounter="https://meridibrand.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
